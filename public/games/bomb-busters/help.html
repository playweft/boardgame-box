<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b63" />
    <title>炸弹克星 · 规则</title>
    <style>
      :root { color-scheme: dark; font-family: "Avenir Next", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif; color: #f4f4e9; background: #176b63; --muted: #b4d0c9; --line: rgb(230 255 247 / 20%); --gold: #ffdf28; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100svh; margin: 0; }
      main { width: min(100%, 40rem); margin: 0 auto; padding: 1.2rem 1.25rem 3rem; }
      a { color: inherit; }
      .back { display: inline-flex; min-height: 2.75rem; align-items: center; color: var(--muted); font-size: 0.8rem; text-decoration: none; }
      h1 { margin: 1.6rem 0 1.2rem; font-size: 1.7rem; font-weight: 500; }
      section { padding: 1rem 0; border-top: 1px solid var(--line); }
      h2 { margin: 0 0 0.6rem; color: var(--gold); font-size: 0.95rem; font-weight: 600; }
      p, li { color: var(--muted); font-size: 0.85rem; line-height: 1.7; }
      p { margin: 0; }
      ol { margin: 0; padding-left: 1.3rem; }
      li + li { margin-top: 0.35rem; }
      .note { margin-top: 1rem; font-size: 0.75rem; }
      .source { color: var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="./index.html">← 返回游戏</a>
      <h1>规则</h1>
      <section>
        <h2>目标</h2>
        <p>合作剪断所有线缆。剪到红线或引爆器走完即失败。</p>
      </section>
      <section>
        <h2>每回合</h2>
        <ol>
          <li>双剪：用自己的一根线，猜队友一根相同的线；猜中时两根一起剪断。</li>
          <li>单剪：若某个数字的剩余线缆全在自己手上，可一次剪断它们。</li>
          <li>只剩红线时公开红线，不会引爆。</li>
          <li>猜错蓝线或黄线，引爆器前进一步，并公开目标线缆。</li>
        </ol>
      </section>
      <p class="note">基础任务规则，不含原版任务专属装备与关卡效果。<br /><a class="source" href="https://www.cocktailgames.com/wp-content/uploads/2023/10/BombBusters_rules_EN.pdf">官方规则书</a></p>
    </main>
  </body>
</html>
