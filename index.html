<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151b2d">
  <meta name="description" content="Boardgame Box 桌游合集，和朋友一起开一局。">
  <title>Boardgame Box</title>
</head>

<body>
  <main id="app">
    <p class="eyebrow">PLAYWEFT · 桌游盒子</p>
    <h1>Boardgame Box</h1>
    <p>挑一款桌游，和朋友围坐开局。</p>
    <a class="game-card" href="./avalon/">
      <span class="game-icon" aria-hidden="true">♜</span>
      <span class="game-copy"><strong>阿瓦隆</strong><small>5–10 人 · 阵营推理 · 线下传屏</small></span>
      <span class="game-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="game-card" href="./bomb-busters/">
      <span class="game-icon" aria-hidden="true">✂</span>
      <span class="game-copy"><strong>炸弹克星</strong><small>2–5 人 · 合作推理</small></span>
      <span class="game-arrow" aria-hidden="true">↗</span>
    </a>
    <a class="game-card" href="./halli-holdem/">
      <span class="game-icon game-icon-halli" aria-hidden="true"><img src="./halli-holdem/icon.svg" alt=""></span>
      <span class="game-copy"><strong>德州心脏病</strong><small>Halli Hold’em · 3–8 人</small></span>
      <span class="game-arrow" aria-hidden="true">↗</span>
    </a>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
